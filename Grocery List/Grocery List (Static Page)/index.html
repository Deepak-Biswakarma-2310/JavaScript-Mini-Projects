<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-container">
        <h1 class="grocery-list-heading">Grocery List</h1>
        <div class="grocery-list-container">
            <ul class="grocery-lists">
                <li class="grocery-list">Milk</li>
                <li class="grocery-list">Peanut Butter</li>
                <li class="grocery-list">Choco Chips</li>
                <li class="grocery-list">Tomato Sauce</li>
                <li class="grocery-list">Cup Cakes</li>
                <li class="grocery-list">Noodles</li>
            </ul>
        </div>
        <div class="home-delivery-container">
            <input type="checkbox" class="home-delivery-checkbox" id="homeDeliveryCheckbox">
            <label for="homeDeliveryCheckbox" class="home-delivery-text">Need Home Delivery</label>
        </div>
        <button class="payment-button">Proceed To Pay</button>
    </div>
</body>
</html>
